  <path d="M80 56 Q82 62 80 68" stroke="#aaaaaa" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M93 54 Q95 60 93 66" stroke="#aaaaaa" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Distinguished beard (salt & pepper) -->
  <path d="M72 110 Q100 128 128 110 Q124 138 100 142 Q76 138 72 110z" fill="#3a3040"/>
  <path d="M80 118 Q100 130 120 118" stroke="#aaaaaa" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Ears -->
  <ellipse cx="66" cy="88" rx="5" ry="7" fill="#a87850"/>
  <ellipse cx="134" cy="88" rx="5" ry="7" fill="#a87850"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="82" rx="6" ry="5.5" fill="#ffffff"/>
  <ellipse cx="112" cy="82" rx="6" ry="5.5" fill="#ffffff"/>
  <circle cx="89" cy="82" r="3.5" fill="#1a0f05"/>
  <circle cx="113" cy="82" r="3.5" fill="#1a0f05"/>
  <circle cx="90" cy="81" r="1" fill="#ffffff"/>
  <circle cx="114" cy="81" r="1" fill="#ffffff"/>
  <!-- Eyebrows (distinguished, slightly grey) -->
  <path d="M82 75 Q88 71 94 75" stroke="#3a3040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M106 75 Q112 71 118 75" stroke="#3a3040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
