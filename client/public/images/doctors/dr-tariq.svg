<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgTariq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1828"/>
      <stop offset="100%" style="stop-color:#1A3A5C"/>
    </linearGradient>
    <linearGradient id="skinTariq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4936a"/>
      <stop offset="100%" style="stop-color:#a87850"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bgTariq)"/>
  <!-- Suit / formal coat -->
  <rect x="40" y="140" width="120" height="74" rx="8" fill="#1a1a2e"/>
  <!-- Tie -->
  <path d="M100 140 L94 155 L100 185 L106 155z" fill="#C9A96E"/>
