  <ellipse cx="100" cy="84" rx="34" ry="40" fill="url(#skinTariq)"/>
  <!-- Salt-and-pepper hair -->
  <ellipse cx="100" cy="56" rx="34" ry="17" fill="#3a3040"/>
  <rect x="66" y="58" width="68" height="12" fill="#3a3040"/>
