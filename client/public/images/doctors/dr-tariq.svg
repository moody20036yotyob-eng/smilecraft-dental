  <rect x="128" y="155" width="18" height="12" rx="3" fill="#C9A96E"/>
  <circle cx="137" cy="161" r="4" fill="#1A3A5C"/>
  <text x="137" y="163.5" text-anchor="middle" fill="#C9A96E" font-size="4">12</text>
