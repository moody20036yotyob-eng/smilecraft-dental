<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>SmileCraft Dental — Premium Dental Care in Dubai</title>
    <meta name="description" content="SmileCraft Dental offers world-class cosmetic dentistry, dental implants, orthodontics, teeth whitening, and more in Dubai Healthcare City. Book your free consultation today." />
    <meta name="keywords" content="dental clinic Dubai, cosmetic dentistry Dubai, dental implants Dubai, teeth whitening Dubai, orthodontics Dubai, SmileCraft Dental" />
    <meta name="author" content="SmileCraft Dental Clinic" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://smilecraftdental.ae/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smilecraftdental.ae/" />
    <meta property="og:title" content="SmileCraft Dental — Premium Dental Care in Dubai" />
    <meta property="og:description" content="World-class cosmetic dentistry, implants, orthodontics and more in Dubai. JCI-accredited clinic with 18+ years of excellence." />
    <meta property="og:image" content="https://smilecraftdental.ae/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:locale:alternate" content="ar_AE" />
    <meta property="og:site_name" content="SmileCraft Dental" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SmileCraft Dental — Premium Dental Care in Dubai" />
    <meta name="twitter:description" content="World-class cosmetic dentistry, implants, orthodontics and more in Dubai Healthcare City." />
    <meta name="twitter:image" content="https://smilecraftdental.ae/og-image.jpg" />

    <!-- Geo targeting -->
    <meta name="geo.region" content="AE-DU" />
    <meta name="geo.placename" content="Dubai" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0066CC" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured Data: Dental Clinic (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Dentist",
      "name": "SmileCraft Dental Clinic",
      "description": "Premium dental care in Dubai offering cosmetic dentistry, implants, orthodontics, and more.",
      "url": "https://smilecraftdental.ae",
      "telephone": "+97141234567",
      "email": "hello@smilecraftdental.ae",
      "priceRange": "$$",
      "currenciesAccepted": "AED",
      "paymentAccepted": "Cash, Credit Card, Insurance",
      "image": "https://smilecraftdental.ae/og-image.jpg",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Tower 5, Healthcare City",
        "addressLocality": "Dubai",
        "addressCountry": "AE"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "25.2285",
        "longitude": "55.3273"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "09:00",
          "closes": "20:00"
        }
      ],
      "sameAs": [
        "https://www.instagram.com/smilecraftdental",
        "https://www.facebook.com/smilecraftdental"
      ],
      "hasMap": "https://maps.google.com/?q=Dubai+Healthcare+City",
      "medicalSpecialty": [
        "Cosmetic Dentistry",
        "Dental Implants",
        "Orthodontics",
        "Pediatric Dentistry",
        "Periodontics"
      ]
    }
    </script>

    <!-- Fonts — loaded async so they never block first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Tajawal:wght@400;500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
